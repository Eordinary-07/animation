name: Fetch CGBoost blend samples

on:
  workflow_dispatch:
  push:
    branches: [arena/c07d05d5-animation]
    paths: ['.github/workflows/fetch-cgboost-blends.yml']

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download small blend samples
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p blends
          gh release download merged-ocr --clobber \
            -p '05_04_exercise_1.blend' \
            -p '05_04_exercise_2.blend' \
            -p '03_24_sculpting_the_hair_final.blend' \
            -D blends
          ls -la blends

      - uses: actions/upload-artifact@v4
        with:
          name: blend-small
          path: blends/
          retention-days: 7
