name: OCR audit

run-name: Extract book content from merged PDF

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/ocr-audit.yml"

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download merged PDF from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/merged
          gh release download merged-ocr -R "$GITHUB_REPOSITORY" -p '*.pdf' -D /tmp/merged
          ls -la /tmp/merged

      - name: Extract Survival Kit front matter and TOC
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pypdf fonttools
          python3 - <<'PY' | tee /tmp/results.md
          import glob, re
          from pypdf import PdfReader

          def norm(s):
              s = s.lower()
              s = re.sub(r"[^a-z0-9]+", " ", s)
              return re.sub(r"\s+", " ", s).strip()

          path = sorted(glob.glob("/tmp/merged/*.pdf"))[0]
          r = PdfReader(path)
          print("===RESULTS===")
          # Section 8 = The Animator's Survival Kit, merged pages 3061-3406.
          # Dump front matter + TOC + intro (pages 3061-3110) in full.
          for p in range(3061, 3111):
              try:
                  t = r.pages[p - 1].extract_text() or ""
              except Exception:
                  t = ""
              t = re.sub(r"[ \t]+", " ", t).strip()
              if t:
                  print("PAGE %d: %s" % (p, t[:1500]))
              else:
                  print("PAGE %d: <empty>" % p)
          # Also grab a few chapter-opening pages spread through the book
          for p in [3130, 3160, 3190, 3220, 3250, 3280, 3310, 3340, 3370, 3400]:
              try:
                  t = r.pages[p - 1].extract_text() or ""
              except Exception:
                  t = ""
              t = re.sub(r"[ \t]+", " ", t).strip()
              print("SPREAD p%d: %s" % (p, t[:400]))
          print("===END===")
          PY

      - name: Commit results to branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          B64=$(base64 -w0 /tmp/results.md)
          SHA=$(gh api "repos/$GITHUB_REPOSITORY/contents/ocr-audit-results.md?ref=$GITHUB_REF_NAME" --jq .sha 2>/dev/null || true)
          if [ -n "${SHA}" ]; then
            gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/ocr-audit-results.md" \
              -f message="OCR extract: Survival Kit content (auto)" -f content="$B64" -f branch="$GITHUB_REF_NAME" -f sha="$SHA"
          else
            gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/ocr-audit-results.md" \
              -f message="OCR extract: Survival Kit content (auto)" -f content="$B64" -f branch="$GITHUB_REF_NAME"
          fi
          echo "Results committed to $GITHUB_REF_NAME"
